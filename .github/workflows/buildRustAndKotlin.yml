name: Build Rust Native Bridge & Kotlin Tests

on:
  push:
  pull_request:

jobs:
  build-rust-native:
    name: Build Rust Native cdylib for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_name: libnative_bridge.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_name: native_bridge.dll
          - os: macos-latest
            target: x86_64-apple-darwin
            lib_name: libnative_bridge.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            lib_name: libnative_bridge.dylib
          - os: ubuntu-latest
            target: aarch64-linux-android
            lib_name: libnative_bridge.so
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            lib_name: libnative_bridge.so

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK (if Android)
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
        
      - name: Install cargo-ndk (if Android)
        if: contains(matrix.target, 'android')
        run: cargo install cargo-ndk

      - name: Build Desktop (Cargo flag)
        if: ${{ !contains(matrix.target, 'android') }}
        working-directory: native-bridge
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Android (Cargo NDK)
        if: contains(matrix.target, 'android')
        working-directory: native-bridge
        run: cargo ndk -t ${{ matrix.target }} -o ./jniLibs build --release

      - name: Upload Artifact (Desktop)
        if: ${{ !contains(matrix.target, 'android') }}
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.target }}
          path: native-bridge/target/${{ matrix.target }}/release/${{ matrix.lib_name }}

      - name: Upload Artifact (Android)
        if: contains(matrix.target, 'android')
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.target }}
          path: native-bridge/jniLibs/**/${{ matrix.lib_name }}

  code-checks-with-native:
    name: Run Unit Tests with Native Bridge
    needs: build-rust-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          cache: 'gradle'
          distribution: 'temurin'
          java-version: 21

      - name: Download all Native Artifacts
        uses: actions/download-artifact@v4
        with:
          path: desktop/linuxFilesForJar/native/
          merge-multiple: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile kotlin and build classes
        run: ./gradlew classes

      - name: Run code checks
        run: ./gradlew check
