name: Build Rust Native Bridge & Kotlin Tests

on:
  push:
  pull_request:

jobs:
  build-and-test-desktop:
    name: Build Native Bridge & Run Code Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_name: libnative_bridge.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_name: native_bridge.dll
          - os: macos-latest
            target: x86_64-apple-darwin
            lib_name: libnative_bridge.dylib
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Bridge
        working-directory: native-bridge
        run: cargo build --release

      - uses: actions/setup-java@v4
        with:
          cache: 'gradle'
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile kotlin and build classes
        run: ./gradlew classes

      - name: Run code checks with native bridge
        run: ./gradlew check -Djava.library.path=native-bridge/target/release -Dunciv.test.requireNativeBridge=true

      - name: Upload Native Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.target }}
          path: native-bridge/target/release/${{ matrix.lib_name }}

  build-rust-native:
    name: Build Rust Native cdylib for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            lib_name: libnative_bridge.dylib
          - os: ubuntu-latest
            target: aarch64-linux-android
            lib_name: libnative_bridge.so
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            lib_name: libnative_bridge.so

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK (if Android)
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Install cargo-ndk (if Android)
        if: contains(matrix.target, 'android')
        run: cargo install cargo-ndk

      - name: Build Desktop (Cargo flag)
        if: ${{ !contains(matrix.target, 'android') }}
        working-directory: native-bridge
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Android (Cargo NDK)
        if: contains(matrix.target, 'android')
        working-directory: native-bridge
        run: cargo ndk -t ${{ matrix.target }} -o ./jniLibs build --release

      - name: Upload Artifact (Desktop)
        if: ${{ !contains(matrix.target, 'android') }}
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.target }}
          path: native-bridge/target/${{ matrix.target }}/release/${{ matrix.lib_name }}

      - name: Upload Artifact (Android)
        if: contains(matrix.target, 'android')
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.target }}
          path: native-bridge/jniLibs/**/${{ matrix.lib_name }}
